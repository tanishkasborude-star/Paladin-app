<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Learn history through interactive story-driven lessons, daily challenges, and addictive progression">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Paladin">
  <title>Paladin — Learn History</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div id="app-container">
    <div id="screen-auth" class="screen"></div>
    <div id="screen-onboarding" class="screen"></div>
    <div id="screen-home" class="screen"></div>
    <div id="screen-lesson" class="screen"></div>
    <div id="screen-quiz" class="screen"></div>
    <div id="screen-skill-tree" class="screen"></div>
    <div id="screen-daily" class="screen"></div>
    <div id="screen-leaderboard" class="screen"></div>
    <div id="screen-profile" class="screen"></div>
  </div>
  <nav id="bottom-navbar"></nav>
  <div id="toast-container"></div>
  <canvas id="confetti-canvas"></canvas>

  <!-- Firebase SDK (compat) — loaded before app module -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script type="module" src="js/app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
